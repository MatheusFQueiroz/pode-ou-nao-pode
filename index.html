<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF6E5">
<title>Pode ou não pode?</title>
<meta name="description" content="Jogo para crianças sobre cuidar dos aparelhos: em cada situação, decida se pode ou não pode e descubra o porquê.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fontes/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/nunito-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="fundo" aria-hidden="true"></div>

<header class="barra">
  <button class="marca" id="btInicio" aria-label="Ir para os temas"><span><b>Pode ou não pode?</b><small>Cuidando dos aparelhos</small></span></button>
  <button class="bt-barra" id="btMapa"><span>Temas</span></button>
  <button class="bt-barra" id="btAlbum"><span>Carteirinha</span></button>
  <button class="bt-barra" id="btAjustes" aria-label="Ajustes"><span>Ajustes</span></button>
</header>

<main>
  <section class="tela" id="mapa"></section>

  <section class="tela oculto" id="jogo">
    <div class="jogo-topo">
      <button class="bt-voltar" id="btVoltar">Temas</button>
      <div class="chip" id="chipTema"></div>
      <div class="chip-seq oculto" id="chipSeq" aria-live="polite"></div>
      <div class="passos" id="passos" aria-hidden="true"></div>
      <button class="bt-redondo" id="btOuvir" aria-label="Ouvir a situação"></button>
    </div>
    <div class="palco" id="palco"></div>
    <div class="aviso" id="aviso" aria-live="polite"></div>
  </section>

  <section class="tela oculto" id="album"></section>
  <section class="tela oculto" id="ajustes"></section>
</main>

<div class="veu oculto" id="premio" role="dialog" aria-modal="true" aria-labelledby="premioTit"></div>

<script src="icones.js"></script>
<script src="jogo.js"></script>
</body>
</html>
